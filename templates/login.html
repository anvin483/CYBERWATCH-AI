<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberwatch AI Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
                <span class="status-dot"></span>
                <div>
                    <h1>CYBERWATCH AI</h1>
                    <p>Secure Threat Monitoring Console</p>
                </div>
            </div>
            <form method="post" class="login-form">
                <label>
                    <span>Username</span>
                    <input name="username" autocomplete="username" value="admin" required>
                </label>
                <label>
                    <span>Password</span>
                    <input name="password" type="password" autocomplete="current-password" required>
                </label>
                {% if error %}
                    <div class="login-error">{{ error }}</div>
                {% endif %}
                <button type="submit">ENTER DASHBOARD</button>
            </form>
            <p class="login-hint">Use the administrator credentials configured for this deployment.</p>
        </section>
    </main>
</body>
</html>
