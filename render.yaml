services:
  - type: web
    name: cyberwatch-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: HOST
        value: "0.0.0.0"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cyberwatch-db
          property: connectionString
      - key: RETENTION_DAYS
        value: "90"

databases:
  - name: cyberwatch-db
    databaseName: cyberwatch
    user: cyberwatch
    plan: free
